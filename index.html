<body>
  <div class="app" id="app">

  <script type="module">
    const MODEL_ID = 'Xenova/twitter-roberta-base-sentiment-latest';

    function filterComments(){
      const q=($('#commentSearch')?.value||'').toLowerCase();const sent=$('#sentimentFilter')?.value||'all';const conf=$('#confidenceFilter')?.value||'all';

    async function loadPipeline(){
      if(sentimentPipe)return sentimentPipe;
      setModelState('loading','Downloading model files from Hugging Face. This can take a few minutes on first use.');
      const result=$('#resultContent');
      if(result)result.innerHTML=`<div class="progress-wrap"><div class="state-top"><span class="state-dot" style="background:var(--blue)"></span>Preparing the sentiment model</div><p class="state-caption">The model downloads once to your browser cache. No comments are sent to a server.</p><div class="track" style="margin-top:16px"><div class="fill positive" style="width:38%;animation:pulse 1.2s ease-in-out infinite alternate"></div></div></div>`;
      try{
        const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.2');
        env.allowLocalModels=false;
        sentimentPipe=await pipeline('text-classification',MODEL_ID,{progress_callback:(progress)=>{
          if(progress.status==='progress'&&result){const pct=Number.isFinite(progress.progress)?Math.round(progress.progress):0;result.innerHTML=`<div class="progress-wrap"><div class="state-top"><span class="state-dot" style="background:var(--blue)"></span>Downloading sentiment model</div><p class="state-caption">${esc(progress.file||'Model files')} · ${pct}%</p><div class="track" style="margin-top:16px"><div class="fill positive" style="width:${pct}%"></div></div></div>`;}
        }});
        setModelState('ready');return sentimentPipe;
      }catch(error){sentimentPipe=null;setModelState('error','Check your internet connection, then try again. Model download failed.');throw new Error('The sentiment model could not be loaded. Check your internet connection and try again.');}
    }
    function normalizeOutput(output){
      const rows=Array.isArray(output)?output:[output];
      const best=rows.filter(Boolean).sort((a,b)=>b.score-a.score)[0];
      if(!best||typeof best.score!=='number')throw new Error('The model returned an unexpected result.');
      let label=String(best.label).toLowerCase();
      if(label.includes('label_')){const index=Number(label.split('_').pop());label=({0:'negative',1:'neutral',2:'positive'})[index]||label;}
      if(!sentiments.includes(label))throw new Error(`Unsupported model label: ${best.label}`);
      return {sentiment:label,confidence:best.score};
    }
    async function analyzeText(rawText,source,resultNode){
      if(isAnalyzing)return;
      const texts=String(rawText||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      if(!texts.length){resultNode.innerHTML=`<div class="empty result-blank"><h2>Add a comment first</h2><p>Enter at least one non-empty comment to analyze.</p></div>`;return;}
      isAnalyzing=true;
      try{
        const classifier=await loadPipeline();
        const added=[];
        for(let i=0;i<texts.length;i++){
          resultNode.innerHTML=`<div class="progress-wrap"><div class="state-top"><span class="state-dot" style="background:var(--blue)"></span>Analyzing comment ${i+1} of ${texts.length}</div><p class="state-caption">Running ${MODEL_LABEL}. Keep this page open.</p><div class="track" style="margin-top:16px"><div class="fill positive" style="width:${Math.round((i/texts.length)*100)}%"></div></div></div>`;
          const raw=await classifier(texts[i],{topk:null});
          const prediction=normalizeOutput(raw);
          const emojis=texts[i].match(emojiRegex)||[];
          const item={id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,text:texts[i],source:source.trim(),date:new Date(),emojis,sentiment:prediction.sentiment,confidence:prediction.confidence,corrected:null};
          records.push(item);added.push(item);
        }
        const last=added[added.length-1];
        resultNode.innerHTML=`<div class="result-ready"><div class="eyebrow">Model prediction</div><div class="result-label ${last.sentiment}">${last.sentiment.toUpperCase()}</div><div class="result-item"><span class="result-key">Confidence</span><div class="confidence-row"><div class="confidence-track"><div class="confidence-fill" style="width:${(last.confidence*100).toFixed(1)}%"></div></div><strong>${(last.confidence*100).toFixed(1)}%</strong></div></div><div class="result-item"><span class="result-key">Emojis</span><span>${last.emojis.length?esc(last.emojis.join(' ')):'None detected'}</span></div><div class="result-item"><span class="result-key">Source</span><span>${esc(last.source||'Not specified')}</span></div><div class="result-item"><span class="result-key">Analyzed</span><span>${new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(last.date)}</span></div>${added.length>1?`<div class="notice" style="margin-top:13px">${added.length-1} additional comments analyzed. The most recent result is shown here.</div>`:''}<div class="result-note">Confidence is the model’s estimated probability, not a guarantee of correctness. Correct labels in Comments.</div><button class="button" style="margin-top:14px" id="viewAnalyzed">View comments</button></div>`;
        $('#viewAnalyzed').addEventListener('click',()=>setView('comments'));
        setModelState('ready');
      }catch(error){
        resultNode.innerHTML=`<div class="empty result-blank"><div class="empty-mark" style="color:var(--red)">!</div><h2>Analysis couldn’t finish</h2><p>${esc(error.message||'Unexpected error. Try again.')}</p><button class="button" id="retryModel">Try again</button></div>`;
        $('#retryModel').addEventListener('click',()=>analyzeText(rawText,source,resultNode));
      }finally{isAnalyzing=false;}
    }
    function parseCsv(text){
      const rows=[];let row=[],cell='',quoted=false;
      for(let i=0;i<text.length;i++){
        const char=text[i];
        if(quoted){if(char==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(char==='"')quoted=false;else cell+=char;}
        else if(char==='"')quoted=true;
        else if(char===','){row.push(cell);cell='';}
        else if(char==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
        else if(char!=='\r')cell+=char;
      }
      if(cell.length||row.length){row.push(cell);rows.push(row);}
      const clean=rows.filter(r=>r.some(v=>v.trim()));if(clean.length<2)throw new Error('CSV needs a header row and at least one data row.');
      const headers=clean[0].map((h,i)=>h.trim()||`Column ${i+1}`);const data=clean.slice(1).map(values=>Object.fromEntries(headers.map((h,i)=>[h,(values[i]||'').trim()])));
      return {headers,rows:data};
    }
    function inferCsvColumn(headers,rows){
      const match=headers.find(h=>/comment|review|text|body|message|content|feedback/i.test(h));
      if(match)return match;
      return headers.map(h=>[h,rows.reduce((sum,row)=>sum+(row[h]||'').length,0)]).sort((a,b)=>b[1]-a[1])[0]?.[0]||headers[0];
    }
    async function extractFile(file){
      const name=file.name.toLowerCase();
      if(name.endsWith('.csv')){
        const parsed=parseCsv(await file.text());window.pendingCsv=parsed;
        const select=$('#csvColumn');select.innerHTML=parsed.headers.map(h=>`<option value="${esc(h)}">${esc(h)}</option>`).join('');
        const selected=inferCsvColumn(parsed.headers,parsed.rows);select.value=selected;$('#csvColumnWrap').hidden=false;
        return parsed.rows.map(row=>row[selected]||'').filter(Boolean).join('\n');
      }
      if(name.endsWith('.txt')||name.endsWith('.md'))return await file.text();
      if(name.endsWith('.pdf')){
        const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
        pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
        const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;let pages=[];
        for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){const page=await pdf.getPage(pageNo);const content=await page.getTextContent();pages.push(content.items.map(item=>item.str).join(' '));}
        return pages.join('\n');
      }
      if(name.endsWith('.docx')){
        const mammoth=await import('https://esm.sh/mammoth@1.9.0');
        const result=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return result.value;
      }
      if(/\.(jpg|jpeg|png|webp)$/.test(name)){
        const tesseract=await import('https://esm.sh/tesseract.js@6');
        const result=await tesseract.recognize(file,'eng',{logger:info=>{if(info.status==='recognizing text')$('#fileStatus').textContent=`Reading image text… ${Math.round((info.progress||0)*100)}%`;}});
        return result.data.text;
      }
      throw new Error(`Unsupported file type: ${file.name}`);
    }
    async function processFiles(files){
      if(!files.length)return;
      $('#fileStatus').textContent=`Reading ${files.length} file${files.length===1?'':'s'}…`;
      $('#csvColumnWrap').hidden=true;window.pendingCsv=null;
      try{
        const outputs=[];
        for(const file of files){
          $('#fileStatus').textContent=`Reading ${file.name}…`;
          const text=await extractFile(file);
          if(!text.trim())throw new Error(`No readable text was found in ${file.name}. Scanned PDFs may need OCR from an image upload.`);
          outputs.push(text.trim());
        }
        $('#fileText').value=outputs.join('\n\n');
        $('#fileStatus').textContent=`Extracted text from ${files.length} file${files.length===1?'':'s'}. Review it below before analysis.`;
      }catch(error){$('#fileStatus').textContent=error.message||'Could not read this file.';}
    }
    function answerQuestion(question,node){
      const q=question.trim().toLowerCase();if(!q){node.textContent='Enter a question about the current comments.';return;}
      if(!records.length){node.textContent='There are no analyzed comments in this session yet.';return;}
      const counts=tally(),total=records.length;
      const pos=records.filter(i=>sentimentOf(i)==='positive'),neg=records.filter(i=>sentimentOf(i)==='negative'),neu=records.filter(i=>sentimentOf(i)==='neutral');
      let answer='';
      if(/percentage|percent|how many|share|breakdown|compare|comparison|distribution/.test(q)) answer=`In this session (${total} comments): positive ${counts.positive} (${percent(counts.positive,total)}), neutral ${counts.neutral} (${percent(counts.neutral,total)}), negative ${counts.negative} (${percent(counts.negative,total)}).`;
      else if(/confidence|uncertain|review|sure/.test(q)){const low=records.filter(i=>i.confidence<.65);answer=`Average model confidence is ${(confidenceAverage()*100).toFixed(1)}%. ${low.length} of ${total} comments are below 65% confidence.${low.length?` Examples: ${low.slice(0,3).map(i=>`“${i.text}” (${(i.confidence*100).toFixed(1)}%)`).join('; ')}`:''}`;}
      else if(/emoji|emojis|emoticon/.test(q)){
        const subset=/positive|good|like/.test(q)?pos:/negative|bad|complain/.test(q)?neg:/neutral/.test(q)?neu:records;
        const tallyEmoji=new Map();subset.forEach(i=>i.emojis.forEach(e=>tallyEmoji.set(e,(tallyEmoji.get(e)||0)+1)));
        const list=[...tallyEmoji.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
        answer=list.length?`In ${subset.length} matching comment${subset.length===1?'':'s'}, the most frequent emojis are ${list.map(([e,c])=>`${e} (${c})`).join(', ')}.`:'No emojis appeared in the matching comments.';
      }
      else if(/negative|complain|problem|issue|dislike|concern|bad|pain/.test(q)) answer=neg.length?`${neg.length} comments were classified negative (${percent(neg.length,total)}). Examples from the data: ${neg.slice(0,4).map(i=>`“${i.text}”`).join(' · ')}`:'No comments were classified negative in this session.';
      else if(/positive|praise|like|enjoy|good|love/.test(q)) answer=pos.length?`${pos.length} comments were classified positive (${percent(pos.length,total)}). Examples from the data: ${pos.slice(0,4).map(i=>`“${i.text}”`).join(' · ')}`:'No comments were classified positive in this session.';
      else if(/neutral|mixed|okay|indifferent/.test(q)) answer=neu.length?`${neu.length} comments were classified neutral (${percent(neu.length,total)}). Examples from the data: ${neu.slice(0,4).map(i=>`“${i.text}”`).join(' · ')}`:'No comments were classified neutral in this session.';
      else if(/summari|overall|sentiment|customers|people|feedback/.test(q)) answer=`Across ${total} comments, ${counts.positive} are positive, ${counts.neutral} neutral, and ${counts.negative} negative. Average confidence is ${(confidenceAverage()*100).toFixed(1)}%. ${neg.length?`A negative example: “${neg[0].text}”`:pos.length?`A positive example: “${pos[0].text}”`:''}`;
      else answer='I can answer questions about sentiment counts, positive or negative feedback, confidence, and emoji usage in this session. The current dataset does not provide enough information to answer that question reliably.';
      node.textContent=answer;
    }
    function exportCsv(){
      if(!records.length){alert('Analyze comments before exporting.');return;}
      const headers=['comment','sentiment','ai_sentiment','confidence','emojis','source','analyzed_at'];
      const quote=value=>`"${String(value??'').replace(/"/g,'""')}"`;
      const lines=[headers.join(','),...records.map(i=>[i.text,sentimentOf(i),i.sentiment,i.confidence.toFixed(4),i.emojis.join(' '),i.source,i.date.toISOString()].map(quote).join(','))];
      const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));link.download='pulsescope-analysis.csv';link.click();URL.revokeObjectURL(link.href);
    }
    document.addEventListener('click',e=>{if(e.target.closest('[data-view]'))return;});
    renderView();
  </script>
  <style>@keyframes pulse{from{opacity:.5}to{opacity:1}}</style>
</body>
</html>
